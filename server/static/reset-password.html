<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Admin Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&family=Roboto+Flex:opsz,wdth,wght,GRAD@8..144,75..125,300..800,-200..150&display=swap" rel="stylesheet">
<style>
:root{--primary:#355CA8;--on-primary:#fff;--primary-container:#D7E3FF;--surface:#F8F9FF;--surface-high:#E7E8F0;--surface-lowest:#fff;--text:#191C20;--muted:#44474F;--outline:#C4C6D0;--error:#BA1A1A;--elev:0 2px 6px 2px rgba(25,28,32,.12),0 1px 2px rgba(25,28,32,.16);--spring:cubic-bezier(.34,1.56,.64,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:'Roboto Flex',system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 12%,rgba(215,227,255,.95),transparent 32rem),radial-gradient(circle at 90% 18%,rgba(250,216,253,.7),transparent 30rem),var(--surface)}
button,input{font:inherit}
.card{width:min(100%,440px);border-radius:28px;background:color-mix(in srgb,var(--surface-lowest) 78%,var(--primary-container));border:1px solid color-mix(in srgb,var(--outline) 72%,white);box-shadow:var(--elev);overflow:hidden;animation:arrive .65s var(--spring) both}
.head{padding:28px 28px 0}
.icon{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:#001B3F;background:var(--primary-container);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);margin-bottom:18px}
.material-symbols-rounded{font-family:'Material Symbols Rounded';font-size:30px;font-feature-settings:'liga'}
h1{font-size:30px;line-height:1.05;font-variation-settings:"opsz" 30,"wdth" 108,"wght" 760,"GRAD" -10}
p{margin-top:8px;color:var(--muted);line-height:1.45;font-size:14px}
.body{padding:22px 28px 28px;display:grid;gap:14px}
label{font-size:13px;color:var(--muted);font-variation-settings:"opsz" 13,"wdth" 104,"wght" 650,"GRAD" 0}
input{width:100%;min-height:54px;border:1px solid color-mix(in srgb,var(--outline) 76%,white);border-radius:18px;background:var(--surface-lowest);padding:0 16px;color:var(--text);transition:border-radius .45s var(--spring),border-color .2s}
input:focus{outline:3px solid rgba(53,92,168,.3);outline-offset:3px;border-color:var(--primary);border-radius:14px 26px 14px 26px}
.btn{min-height:54px;border:0;border-radius:18px;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-variation-settings:"opsz" 14,"wdth" 104,"wght" 690,"GRAD" 0;transition:transform .45s var(--spring),border-radius .45s var(--spring)}
.btn:hover{transform:translateY(-1px);border-radius:24px 14px 24px 14px}.btn:active{transform:scale(.96)}
.msg{display:none;border-radius:18px;background:var(--primary-container);padding:12px 14px;color:#001B3F;font-size:13px;line-height:1.4}.msg.show{display:block}
.msg.error{background:#FFDAD6;color:#410002}
@keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <div class="icon" aria-hidden="true"><span class="material-symbols-rounded">lock_reset</span></div>
    <h1>Reset required.</h1>
    <p>The default admin password must be changed before the portal or admin panel can be used.</p>
  </div>
  <div class="body">
    <div>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="8+ characters">
    </div>
    <div>
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat password">
    </div>
    <button class="btn" id="save"><span class="material-symbols-rounded" aria-hidden="true">check</span> Save Password</button>
    <div class="msg" id="msg"></div>
  </div>
</main>
<script>
(function(){
'use strict';
const password=document.querySelector('#password');
const confirm=document.querySelector('#confirm');
const save=document.querySelector('#save');
const msg=document.querySelector('#msg');
function show(text,error=false){msg.textContent=text;msg.className='msg show'+(error?' error':'');}
async function submit(){
  if(password.value.length<8){show('Password must be at least 8 characters.',true);return;}
  if(password.value!==confirm.value){show('Passwords do not match.',true);return;}
  save.disabled=true;
  try{
    const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});
    const data=await res.json();
    if(!res.ok){show(data.error||'Password reset failed.',true);return;}
    show('Password updated. Opening portal...');
    window.location.href='/';
  }catch(e){show('Network error: '+e.message,true);}
  finally{save.disabled=false;}
}
save.addEventListener('click',submit);
confirm.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
})();
</script>
</body>
</html>
