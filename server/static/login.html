<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f2fa">
<title>E-Paper Display Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&family=Roboto+Flex:opsz,wdth,wght,GRAD@8..144,75..125,300..800,-200..150&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --md-primary:#355CA8;
  --md-on-primary:#FFFFFF;
  --md-primary-container:#D7E3FF;
  --md-on-primary-container:#001B3F;
  --md-secondary-container:#DAE2F9;
  --md-on-secondary-container:#131C2B;
  --md-tertiary-container:#FAD8FD;
  --md-on-tertiary-container:#28132E;
  --md-surface-container-low:#F2F3FA;
  --md-surface-container:#ECEEF6;
  --md-surface-container-high:#E7E8F0;
  --md-surface-container-lowest:#FFFFFF;
  --md-on-surface:#191C20;
  --md-on-surface-variant:#44474F;
  --md-outline-variant:#C4C6D0;
  --md-inverse-surface:#2E3036;
  --md-inverse-on-surface:#EFF0F7;
  --elev-1:0 1px 2px rgba(25,28,32,.18),0 1px 3px 1px rgba(25,28,32,.09);
  --elev-2:0 2px 6px 2px rgba(25,28,32,.12),0 1px 2px rgba(25,28,32,.16);
  --spring-standard:cubic-bezier(.2,0,0,1);
  --spring-expressive:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:'Roboto Flex',system-ui,sans-serif;
  font-variation-settings:"opsz" 14,"wdth" 100,"wght" 420,"GRAD" 0;
  color:var(--md-on-surface);
  background:
    radial-gradient(circle at 14% 10%,rgba(215,227,255,.95),transparent 34rem),
    radial-gradient(circle at 88% 18%,rgba(250,216,253,.75),transparent 30rem),
    linear-gradient(135deg,#fff 0%,var(--md-surface-container-low) 50%,#EEF4FF 100%);
  display:grid;
  place-items:center;
  padding:24px;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:linear-gradient(rgba(53,92,168,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(53,92,168,.055) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.72),transparent 76%);
}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid rgba(53,92,168,.36);outline-offset:3px}
.material-symbols-rounded{
  font-family:'Material Symbols Rounded';
  font-weight:normal;
  font-style:normal;
  font-size:24px;
  line-height:1;
  font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;
}
.shell{
  width:min(100%,960px);
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(320px,420px);
  gap:22px;
  align-items:center;
  position:relative;
}
.hero{
  animation:arrive .7s var(--spring-expressive) both;
}
.brand{
  width:64px;
  height:64px;
  border-radius:22px;
  display:grid;
  place-items:center;
  color:var(--md-on-primary-container);
  background:linear-gradient(135deg,var(--md-primary-container),var(--md-tertiary-container));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.58),var(--elev-1);
  margin-bottom:22px;
}
.brand .material-symbols-rounded{font-size:34px;font-variation-settings:"FILL" 1,"wght" 560,"GRAD" 0,"opsz" 34}
h1{
  max-width:640px;
  font-size:clamp(42px,8vw,82px);
  line-height:.94;
  font-variation-settings:"opsz" 72,"wdth" 112,"wght" 770,"GRAD" -20;
}
.hero p{
  max-width:520px;
  margin-top:16px;
  color:var(--md-on-surface-variant);
  font-size:16px;
  line-height:1.55;
}
.card{
  border-radius:28px;
  background:color-mix(in srgb,var(--md-surface-container-lowest) 76%,var(--md-primary-container));
  border:1px solid color-mix(in srgb,var(--md-outline-variant) 72%,white);
  box-shadow:var(--elev-1);
  overflow:hidden;
  animation:arrive .8s .08s var(--spring-expressive) both;
}
.card-head{padding:24px 24px 0}
.card-title{
  font-size:22px;
  font-variation-settings:"opsz" 22,"wdth" 106,"wght" 720,"GRAD" 0;
}
.card-sub{margin-top:6px;color:var(--md-on-surface-variant);font-size:13px;line-height:1.45}
.card-body{padding:22px 24px 24px;display:grid;gap:14px}
.field{display:grid;gap:7px}
.field label{font-size:13px;color:var(--md-on-surface-variant);font-variation-settings:"opsz" 13,"wdth" 104,"wght" 650,"GRAD" 0}
.field input{
  width:100%;
  min-height:54px;
  border:1px solid color-mix(in srgb,var(--md-outline-variant) 76%,white);
  border-radius:18px;
  color:var(--md-on-surface);
  background:color-mix(in srgb,var(--md-surface-container-lowest) 78%,white);
  padding:0 16px;
  transition:border-radius .45s var(--spring-expressive),border-color .2s var(--spring-standard),background .2s var(--spring-standard);
}
.field input:focus{
  border-color:var(--md-primary);
  border-radius:14px 26px 14px 26px;
  background:var(--md-surface-container-lowest);
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btn{
  min-height:54px;
  border:0;
  border-radius:18px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-variation-settings:"opsz" 14,"wdth" 104,"wght" 690,"GRAD" 0;
  transition:transform .45s var(--spring-expressive),border-radius .45s var(--spring-expressive),box-shadow .25s var(--spring-standard);
}
.btn:hover{transform:translateY(-1px);border-radius:24px 14px 24px 14px}
.btn:active{transform:scale(.96);border-radius:14px 24px 14px 24px}
.btn-filled{background:var(--md-primary);color:var(--md-on-primary);box-shadow:var(--elev-1)}
.btn-tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.status{
  min-height:44px;
  padding:12px 14px;
  border-radius:18px;
  color:var(--md-on-tertiary-container);
  background:var(--md-tertiary-container);
  font-size:13px;
  line-height:1.4;
  display:none;
}
.status.visible{display:block;animation:arrive .4s var(--spring-expressive) both}
.snackbar{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(calc(100% + 32px));
  opacity:0;
  visibility:hidden;
  max-width:calc(100vw - 32px);
  min-width:280px;
  padding:14px 16px;
  border-radius:24px;
  background:var(--md-inverse-surface);
  color:var(--md-inverse-on-surface);
  box-shadow:var(--elev-2);
  transition:transform .55s var(--spring-expressive),opacity .2s var(--spring-standard),visibility .2s var(--spring-standard),border-radius .55s var(--spring-expressive);
}
.snackbar.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;border-radius:18px 28px 18px 28px}
@keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:760px){
  body{place-items:start center}
  .shell{grid-template-columns:1fr}
  .hero{padding-top:8px}
  .brand{width:52px;height:52px;border-radius:18px;margin-bottom:16px}
  h1{font-size:clamp(38px,12vw,54px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="shell">
  <section class="hero" aria-label="Identity verification intro">
    <div class="brand" aria-hidden="true">
      <span class="material-symbols-rounded">developer_board</span>
    </div>
    <h1>Verify before rendering.</h1>
    <p>Register or sign in to access the e-paper portal. Every display update is stamped with the authenticated user.</p>
  </section>

  <section class="card" aria-label="Login form">
    <div class="card-head">
      <div class="card-title">Identity Verification</div>
      <div class="card-sub">Use an existing account, or create one for this portal.</div>
    </div>
    <div class="card-body">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" placeholder="operator">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="8+ characters">
      </div>
      <div class="actions">
        <button class="btn btn-filled" id="btnLogin">
          <span class="material-symbols-rounded" aria-hidden="true">login</span>
          Login
        </button>
        <button class="btn btn-tonal" id="btnRegister">
          <span class="material-symbols-rounded" aria-hidden="true">person_add</span>
          Register
        </button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </section>
</main>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

const username = document.querySelector('#username');
const password = document.querySelector('#password');
const btnLogin = document.querySelector('#btnLogin');
const btnRegister = document.querySelector('#btnRegister');
const statusBox = document.querySelector('#status');
const snackbar = document.querySelector('#snackbar');
let snackTimer = null;

function toast(message) {
  snackbar.textContent = message;
  snackbar.classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => snackbar.classList.remove('show'), 3200);
}

function setStatus(message, visible = true) {
  statusBox.textContent = message;
  statusBox.classList.toggle('visible', visible);
}

async function auth(path) {
  const body = {
    username: username.value.trim(),
    password: password.value,
  };
  if (!body.username || !body.password) {
    toast('Enter a username and password first.');
    return;
  }

  [btnLogin, btnRegister].forEach(btn => btn.disabled = true);
  setStatus(path.endsWith('register') ? 'Creating account...' : 'Verifying identity...');
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      setStatus(data.error || 'Authentication failed.');
      toast(data.error || 'Authentication failed.');
      return;
    }
    if (data.status === 'pending') {
      setStatus(data.message || 'Registration submitted and awaiting approval.');
      toast('Registration is pending admin approval.');
      return;
    }
    setStatus(`Signed in as ${data.user.username}. Opening portal...`);
    window.location.href = data.user.must_reset_password ? '/reset-password' : '/';
  } catch (e) {
    setStatus('Network error: ' + e.message);
  } finally {
    [btnLogin, btnRegister].forEach(btn => btn.disabled = false);
  }
}

async function redirectIfSignedIn() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) return;
    const data = await res.json();
    if (data.user) window.location.href = '/';
  } catch (_) {}
}

btnLogin.addEventListener('click', () => auth('/api/auth/login'));
btnRegister.addEventListener('click', () => auth('/api/auth/register'));
password.addEventListener('keydown', e => {
  if (e.key === 'Enter') auth('/api/auth/login');
});
redirectIfSignedIn();
})();
</script>
</body>
</html>
